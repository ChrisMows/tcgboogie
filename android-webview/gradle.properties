# Bubblewrap's Java on this PC is 32-bit, which can only address about 2 GB in total, so the heap stays small and
# builds run one step at a time. A bigger heap crashes the build while it merges Firebase's code.
org.gradle.jvmargs=-Xmx1000m -XX:ReservedCodeCacheSize=96m -XX:MaxMetaspaceSize=300m
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
