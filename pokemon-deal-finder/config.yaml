# Pokémon Graded Deal Finder - settings
# The finder re-reads this file on every check, so edits take effect within a minute.
#
# How filtering works: the bot scans eBay ONCE per check, as wide as the loosest active filter profile needs
# (never wider than scan_limits). Each member's profiles then narrow that down to their own alerts.
# Members edit their profiles in Discord with /profile; their plan sets the limits below.

# Starting values for a new filter profile (members change them with /profile set).
profile_defaults:
  min_discount_pct: 30        # price + shipping at least this % below market value
  max_minutes_left: 10        # auction ends within this many minutes
  min_market_value: 30        # card worth at least this
  min_grade: 7
  graders: [PSA, BGS, CGC, SGC, TAG]
  languages: [english, japanese]
  card_types: [graded, raw]   # graded slabs, raw (ungraded) cards, or both
  min_raw_condition: LP       # raw cards: NM, LP, MP, HP or DMG (LP = Lightly Played or better)

# TCGplayer "Compare" links on raw-card alerts. Paste your Impact affiliate link prefix here to earn commission,
# e.g. https://tcgplayer.pxf.io/c/XXXXXXX/XXXXXX/XXXXX?u=  (the card's TCGplayer page is added after it)
tcgplayer:
  affiliate_prefix: ""

# Hard limits on what any profile can ask for. These cap eBay calls and price-lookup credits.
scan_limits:
  min_discount_pct: 10
  max_minutes_left: 20        # longest "minutes left" any filter can make the scan (the website's Premium limit)
  min_market_value: 30        # deal alerts cover cards worth $30+ (the website's plans say the same: Admin -> Plans)

# Plans. A member's Discord role picks the plan (highest rank wins). "owner" is you.
plans:
  owner:
    label: Owner
    rank: 99
    max_profiles: 50
    alert_delay_seconds: 0
    min_discount_floor: 10    # lowest "% below market" a profile on this plan may use
    max_window_minutes: 60    # longest "minutes left" a profile on this plan may use
    min_value_floor: 30      # lowest "minimum card value" a profile on this plan may use
    features: [japanese]
  premium:
    label: Premium
    role: Premium             # Discord role name the website gives paying Premium members
    rank: 2
    max_profiles: 15
    alert_delay_seconds: 0
    min_discount_floor: 20
    max_window_minutes: 20
    min_value_floor: 30
    features: [japanese]
  standard:
    label: Standard
    role: Standard
    rank: 1
    max_profiles: 2
    alert_delay_seconds: 120  # Standard alerts arrive 2 minutes after Premium
    min_discount_floor: 35
    max_window_minutes: 10
    min_value_floor: 30
    features: []

membership:
  roles_enabled: false        # true once the website assigns plan roles (also turn on "Server Members Intent")
  upgrade_url: ""             # link shown on Upgrade / Manage subscription buttons

delivery:
  category_name: Deal Alerts  # member channels are created in categories with this name (50 per category)
  max_channels: 450           # after this many server channels, new members get private threads instead
  thread_parent: member-alerts  # channel that holds members' private threads

deal:
  comp_lookback_days: 30      # only sold comps from the last N days count toward market value
  min_comps: 3                # skip the card if fewer sold comps than this (after outliers removed)
  use_our_sales: true         # graded: also count the eBay sales the bot recorded and members reported (sale table)
  max_comp_spread: 0.35       # skip if comps vary too much (coefficient of variation; 0.35 = 35%)
  comp_refresh_days: 15       # dashboard marks a watchlist card "refresh due" after this many days

poll:
  interval_seconds: 75        # how often to check eBay (75s keeps us well under 5,000 calls/day)
  search_window_minutes: 12   # look a little past max_minutes_left so nothing slips between checks
  max_pages: 2                # max search pages (200 listings each) per check. Results are soonest-ending first, so
                              # at peak times a listing just shows up a few minutes later; this keeps eBay calls in budget
  daily_call_budget: 4500     # of eBay's 5,000/day: the other 500 are kept for the website (reported sales) and spikes
  max_interval_seconds: 540   # never more than 9 minutes between checks, so every auction is seen in its last 10 minutes
  min_details_per_check: 5    # listings opened to identify them, per check, even when the budget is tight. The rest of
                              # the allowance is worked out from the budget left (finder.detail_allowance); listings go
                              # most valuable first, so it's the cheapest ones without the card in the title that wait

ebay:
  marketplace_id: EBAY_US
  category_id: "183454"       # eBay "CCG Individual Cards"
  aspect_filter: "categoryId:183454,Game:{Pokémon TCG}"
  buyer_zip: "10001"          # used so eBay can calculate shipping to you; set to your ZIP
  affiliate_campaign_id: "5339225226"   # eBay Partner Network campaign ID; when set, listing links carry your affiliate tracking
  affiliate_disclosure: "Ad · eBay links may earn us a commission"

graders_allowed: [PSA, BGS, BVG, CGC, CSG, SGC, TAG, ACE]

# Automatic mode: value ANY graded listing via PokemonPriceTracker (needs PPT_API_KEY in .env).
# Your watchlist still works alongside it and takes priority for cards on it.
auto:
  enabled: true
  max_disagreement: 0.4       # skip if our 30-day value and the service's own estimate differ by more than 40%
  # Price-lookup credits. The $9.99 plan gives 20,000 a day (reset midnight UTC), shared with the website.
  daily_credits: 20000        # your plan's daily credits
  website_reserve: 2000       # always left for the website (card pages, price alerts); the bot stops below this
  pace_burst: 1500            # spending is spread over the day; this much may be used ahead of schedule
  max_lookups_per_check: 30   # cap on uncached service calls per eBay check (the plan allows 60 a minute)
  min_listing_price: 2        # listings under this (price + shipping) are never deals; don't spend a lookup
  search_limit: 3             # cards per card-number search; a search costs this many credits even if fewer come back
  search_limit_wide: 8        # retry size, used only when a full first page didn't contain the card
  catalog_cache_days: 90      # how long a card-number lookup is reused (the catalog rarely changes)
  not_found_cache_days: 3     # how long "no card with that number" is reused (new sets get added)
  price_cache_hours: 24       # how long a card's prices are reused: once a day (TCGplayer and eBay data update daily)

red_flags:
  early_bid:                  # flag deals whose price is low only because bidding has barely started
    min_discount_pct: 50
    max_bids: 2
    min_minutes_left: 3
  min_seller_feedback_score: 50
  min_seller_feedback_pct: 98.0
  max_shipping: 25.00         # flag unusually high shipping
  # A GRADED-search listing whose title contains any of these is excluded (they describe raw cards).
  # Raw-card listings may use these words normally.
  graded_only_exclude_keywords:
    - pre-graded
    - pregraded
    - pre graded
    - gem mint quality
    - mint quality
    - ready to grade
    - psa ready
    - grade ready
    - candidate
    - potential 10
    - not graded
    - ungraded
    - raw
  # A listing whose TITLE contains any of these is excluded outright (graded or raw).
  exclude_title_keywords:
    - proxy
    - custom
    - reprint
    - replica
    - fake
    - orica
    - fan art
    - lot
    - bundle
    - you pick
    - pick your
    - choose your
    - cracked
    - crack
    - broken slab
    - damaged slab
    - case damage
    - slab damage
    - label only
    - empty slab
    - no card
    - sticker
    - digital
    - code card
    - mystery
    - repack
    - bulk
    - binder
    # Accessories sold with the card's name and number in the title (display cases, frames, stands, art): not the card.
    - art case
    - display case
    - card case
    - acrylic
    - framed
    - shadow box
    - display stand
    - card stand
    - playmat
    - play mat
    - art print
    - canvas
    - keychain
    - plush
    - 3d print
  # If the DESCRIPTION contains any of these, the alert is still sent but flagged.
  flag_description_keywords:
    - pre-graded
    - not graded
    - ungraded
    - proxy
    - replica
    - reprint
    - custom
    - crack
    - damaged
    - scratch
    - as is
    - no returns
    - stock photo
    - stock image
    - not the actual

# Website mode (run_web.py): deals go to tcgboogie.com, which alerts members by their filters.
website:
  url: https://tcgboogie.com
  scan_refresh_seconds: 120   # how often to re-ask the website how wide to scan
  ebay_watch:                 # price alerts with "also alert me when it's listed on eBay"
    daily_calls: 1000         # most eBay searches a day for these (one per card; hot cards first)
    hot_ratio: 0.85           # target at least 85% of the market price: likely to be listed -> searched every hot_days
    warm_ratio: 0.65          # 65-85%: every warm_days; under 65% (a long shot): every cold_days
    hot_days: 1
    warm_days: 3
    cold_days: 7
    quiet_after: 3            # no listings at all this many searches in a row: checked half as often
    max_per_check: 8          # searches per bot check

# Sealed products (booster boxes, ETBs, bundles, tins, collections, packs): scanned on every Nth check so cards keep
# most of the eBay call budget. Only runs while some member's filter includes sealed. See dealfinder/sealed.py.
sealed:
  enabled: true
  every_n_checks: 3
  categories: [261044, 183456]   # eBay "CCG Sealed Boxes" and "CCG Sealed Packs" (one search each)

# Our own sales history: shortly after an identified graded auction ends, one eBay lookup records its final price
# (if it sold) in the website's sale table. Official Browse API, no scraping. See dealfinder/sales.py.
# Website watch: every few minutes the bot asks tcgboogie.com/api/health and messages the admin on Discord
# (BoogieBot DM) when it fails twice in a row, e.g. if the host wipes the website's settings. And again when fixed.
health:
  enabled: true
  url: https://tcgboogie.com/api/health
  every_minutes: 5
  admin_email: riggsc96@gmail.com

# Admin -> Usage warnings (dealfinder/usage.py): a Discord DM to the health admin when a limit (price credits, eBay
# calls, emails, server disk/memory) reaches each of these percentages, once per level per day. pace_warning also warns
# when today's rate would use up a daily limit before midnight UTC.
usage:
  alerts: true
  alert_at: [75, 90]
  pace_warning: true

# Members' saved prices, refreshed in the background (dealfinder/refresh.py) so website pages never have to buy a
# fresh price while someone waits (and never burst past the price service's ~60 lookups a minute). Every card members
# own, wishlist or watch, most valuable first, once its saved copy is older than max_age_hours. ~3 credits each, out of
# the same paced budget as deal lookups.
refresh:
  enabled: true
  per_check: 10
  daily_lookups: 3000
  max_age_hours: 22          # a little under the 24-hour price life, so pages never find one out of date

# Topps Pokémon cards (1999-2004, not TCG cards): the typical eBay asking price of each card for the website's Topps
# catalog, one eBay search per card every refresh_days. See dealfinder/topps.py.
topps:
  enabled: true
  daily_calls: 150     # out of the same eBay budget as deal searches (911 cards: about 6 days for a full pass)
  max_per_check: 3
  refresh_days: 14     # Topps prices barely move: every two weeks is plenty

sales:
  enabled: true
  daily_calls: 800     # lookups a day (they come out of the same eBay budget as deal searches)
  min_value: 25        # only cards worth $25+ (or bid at $25+ when the value isn't known): each lookup is an eBay call
  max_per_check: 25
  wait_minutes: 10     # after the auction ends

# Photo check: before a deal goes out, Claude compares the listing photos with the official image of the card we priced
# (and other versions of it), and drops deals whose photos show a different card. Needs ANTHROPIC_API_KEY in .env.
vision:
  model: claude-haiku-5-5     # cheapest; claude-opus-5-5 is more careful but costs about 40x as much
  effort: low
  max_listing_photos: 3
